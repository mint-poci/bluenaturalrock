<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Peta Daerah">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%232563eb'/%3E%3Cpath d='M128 160l85-32 86 32 85-32v224l-85 32-86-32-85 32V160z' fill='none' stroke='%23ffffff' stroke-width='28' stroke-linejoin='round'/%3E%3Cpath d='M213 128v224M299 160v224' stroke='%23ffffff' stroke-width='28'/%3E%3C/svg%3E">
  <title>Login Portal Peta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --border: #e2e8f0; --primary: #2563eb; --primary-hover: #1d4ed8; --danger: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;
      --border: #334155; --primary: #3b82f6; --primary-hover: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1.25rem;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.75rem; width: 100%; max-width: 380px; position: relative;
    }
    .theme-btn {
      position: absolute; top: 1.25rem; right: 1.25rem; background: transparent;
      border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px;
      border-radius: 10px; cursor: pointer;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.25rem; }
    p.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.35rem; }
    input {
      width: 100%; padding: 0.7rem 0.85rem; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.92rem;
    }
    .btn {
      width: 100%; padding: 0.75rem; border-radius: 10px; border: none;
      font-weight: 600; font-size: 0.92rem; cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; margin-top: 0.25rem; }
    .btn-google {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .divider { text-align: center; margin: 1.15rem 0; font-size: 0.78rem; color: var(--muted); }
    .alert {
      background: rgba(239, 68, 68, 0.12); color: var(--danger); padding: 0.7rem;
      border-radius: 8px; font-size: 0.82rem; margin-bottom: 1rem; display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <button class="theme-btn" id="themeToggle">🌙</button>
    <h1>Portal Peta Daerah</h1>
    <p class="subtitle">Khusus koordinator & admin terdaftar</p>
    <div class="alert" id="errorBox"></div>

    <form id="authForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Masuk</button>
    </form>

    <div class="divider">atau masuk cepat</div>

    <button type="button" class="btn btn-google" id="googleBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
      Lanjutkan dengan Google
    </button>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzX0UOkVwvRkUuGBWVcec92AWj2tjQeoE",
      authDomain: "territory-assistant-40a9b.firebaseapp.com",
      projectId: "territory-assistant-40a9b",
      storageBucket: "territory-assistant-40a9b.firebasestorage.app",
      messagingSenderId: "729411479743",
      appId: "1:729411479743:web:bc19a775993ff6bf897e0a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "dashboard.html";
    });

    const errorBox = document.getElementById("errorBox");
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
        window.location.href = "dashboard.html";
      } catch (err) {
        showError("Email atau password salah / belum terdaftar.");
      }
    });

    document.getElementById("googleBtn").addEventListener("click", async () => {
      errorBox.style.display = "none";
      try {
        await signInWithPopup(auth, provider);
        window.location.href = "dashboard.html";
      } catch (err) {
        showError("Gagal login Google.");
      }
    });

    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);
    themeToggle.textContent = savedTheme === "dark" ? "☀️" : "🌙";
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      themeToggle.textContent = next === "dark" ? "☀️" : "🌙";
    });
  </script>
</body>
</html>
