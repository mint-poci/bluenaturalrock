<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: background-color 0.2s, color 0.2s;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    .theme-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    p.subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.4rem; }
    input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; margin-top: 0.5rem; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-google {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-google:hover { border-color: var(--muted); }
    .divider {
      text-align: center;
      margin: 1.25rem 0;
      position: relative;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .divider::before, .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    .toggle-mode {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .toggle-mode a { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; }
    .alert {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <button class="theme-btn" id="themeToggle" title="Ganti Tema">🌙</button>
    <h1 id="formTitle">Selamat Datang</h1>
    <p class="subtitle" id="formSubtitle">Silakan masuk untuk melanjutkan ke dashboard</p>

    <div class="alert" id="errorBox"></div>

    <form id="authForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimal 6 karakter" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Masuk</button>
    </form>

    <div class="divider">atau</div>

    <button type="button" class="btn btn-google" id="googleBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
      Lanjutkan dengan Google
    </button>

    <div class="toggle-mode">
      <span id="toggleText">Belum punya akun?</span>
      <a id="toggleLink">Daftar sekarang</a>
    </div>
  </div>

  <!-- Firebase SDK (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup,
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    // GANTI DENGAN KONFIGURASI FIREBASE KAMU
    const firebaseConfig = {
      apiKey: "AIzaSyCzX0UOkVwvRkUuGBWVcec92AWj2tjQeoE",
      authDomain: "territory-assistant-40a9b.firebaseapp.com",
      projectId: "territory-assistant-40a9b",
      storageBucket: "territory-assistant-40a9b.firebasestorage.app",
      messagingSenderId: "729411479743",
      appId: "1:729411479743:web:bc19a775993ff6bf897e0a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Redirect otomatis jika sudah login
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "dashboard.html";
      }
    });

    // State Login / Register
    let isLoginMode = true;
    const authForm = document.getElementById("authForm");
    const errorBox = document.getElementById("errorBox");
    const submitBtn = document.getElementById("submitBtn");

    document.getElementById("toggleLink").addEventListener("click", () => {
      isLoginMode = !isLoginMode;
      document.getElementById("formTitle").textContent = isLoginMode ? "Selamat Datang" : "Buat Akun Baru";
      document.getElementById("formSubtitle").textContent = isLoginMode ? "Silakan masuk untuk melanjutkan ke dashboard" : "Daftar untuk mendapatkan akses ke portal";
      submitBtn.textContent = isLoginMode ? "Masuk" : "Daftar";
      document.getElementById("toggleText").textContent = isLoginMode ? "Belum punya akun?" : "Sudah punya akun?";
      document.getElementById("toggleLink").textContent = isLoginMode ? "Daftar sekarang" : "Masuk di sini";
      errorBox.style.display = "none";
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    // Submit Email & Password
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      submitBtn.disabled = true;
      submitBtn.textContent = "Memproses...";

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
        window.location.href = "dashboard.html";
      } catch (err) {
        showError("Gagal: " + err.message.replace("Firebase: ", ""));
        submitBtn.disabled = false;
        submitBtn.textContent = isLoginMode ? "Masuk" : "Daftar";
      }
    });

    // Login dengan Google
    document.getElementById("googleBtn").addEventListener("click", async () => {
      errorBox.style.display = "none";
      try {
        await signInWithPopup(auth, provider);
        window.location.href = "dashboard.html";
      } catch (err) {
        showError("Login Google gagal: " + err.message.replace("Firebase: ", ""));
      }
    });

    // Dark/Light Mode Toggle
    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);
    themeToggle.textContent = savedTheme === "dark" ? "☀️" : "🌙";

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      themeToggle.textContent = next === "dark" ? "☀️" : "🌙";
    });
  </script>
</body>
</html>
