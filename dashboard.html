<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Peta Daerah — Karsalana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warning: #d97706;
      --warning-soft: #fef3c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
    .form-control {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; outline: none; transition: 0.2s; background: #fff;
    }
    .form-control:focus { border-color: var(--primary); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
      border: none; cursor: pointer; transition: 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-block { width: 100%; }

    /* Header */
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 16px; font-weight: 700; }
    .header-badge {
      font-size: 12px; background: var(--primary-soft); color: var(--primary);
      padding: 4px 10px; border-radius: 999px; font-weight: 600;
    }

    /* Main Layout */
    .workspace { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 430px; max-width: 100%; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .controls { padding: 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .kdl-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .tab-btn {
      padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border);
      background: #fff; font-size: 12px; font-weight: 600; color: var(--muted);
      cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .stats-bar {
      display: flex; justify-content: space-between; font-size: 12px; color: var(--muted);
      padding: 0 2px;
    }

    /* Territory List */
    .territory-list { flex: 1; overflow-y: auto; }
    .territory-item {
      padding: 13px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      cursor: pointer; transition: 0.15s;
    }
    .territory-item:hover { background: #f8fafc; }
    .territory-item.selected { background: var(--primary-soft); border-left: 4px solid var(--primary); }

    .item-info { min-width: 0; flex: 1; }
    .item-title {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .item-sub { font-size: 12px; color: var(--muted); }

    .status-pill {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 8px;
      white-space: nowrap; flex-shrink: 0;
    }
    .status-kosong { background: var(--success-soft); color: var(--success); border: 1px solid #bbf7d0; }
    .status-dipinjam { background: var(--warning-soft); color: var(--warning); border: 1px solid #fde68a; }

    /* Map & Detail Panel */
    .map-area { flex: 1; position: relative; display: flex; flex-direction: column; }
    #map { flex: 1; width: 100%; z-index: 1; }

    .detail-drawer {
      position: absolute; bottom: 20px; right: 20px; left: 20px; max-width: 440px; margin-left: auto;
      background: var(--surface); border-radius: 14px; border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.12); padding: 18px; z-index: 1000;
      display: none;
    }
    .detail-drawer.open { display: block; }
    .drawer-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .drawer-title { font-size: 16px; font-weight: 700; }
    .drawer-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .close-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    @media (max-width: 768px) {
      .workspace { flex-direction: column; }
      .sidebar { width: 100%; height: 55%; border-right: none; border-bottom: 1px solid var(--border); }
      .map-area { height: 45%; }
      .detail-drawer { left: 10px; right: 10px; bottom: 10px; max-width: none; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <h1>Portal Peta Daerah</h1>
      <span class="header-badge">KDL Tegal & Pemalang</span>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="workspace">
    <aside class="sidebar">
      <div class="controls">
        <input type="text" id="search-input" class="form-control" placeholder="Cari nomor, nama daerah, atau pemegang..." />
        <div class="kdl-tabs" id="kdl-tabs">
          <button class="tab-btn active" data-kdl="ALL">Semua</button>
          <button class="tab-btn" data-kdl="KDL Tegal Timur">KDL Tegal Timur</button>
          <button class="tab-btn" data-kdl="KDL Tegal Barat">KDL Tegal Barat</button>
          <button class="tab-btn" data-kdl="KDL Pemalang">KDL Pemalang</button>
        </div>
        <div class="stats-bar">
          <span id="count-shown">Menampilkan 0 peta</span>
          <span id="count-available">Kosong: 0</span>
        </div>
      </div>
      <div class="territory-list" id="territory-list"></div>
    </aside>

    <main class="map-area">
      <div id="map"></div>

      <!-- Detail & Edit Drawer -->
      <div class="detail-drawer" id="detail-drawer">
        <div class="drawer-header">
          <div>
            <div class="drawer-title" id="drawer-title">Daerah -</div>
            <div class="drawer-meta" id="drawer-meta">-</div>
          </div>
          <button class="close-btn" id="btn-close-drawer">&times;</button>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Nomor Daerah</label>
            <input type="text" id="edit-nomor" class="form-control" />
          </div>
          <div class="form-group">
            <label>Wilayah KDL</label>
            <select id="edit-kdl" class="form-control">
              <option value="KDL Tegal Timur">KDL Tegal Timur</option>
              <option value="KDL Tegal Barat">KDL Tegal Barat</option>
              <option value="KDL Pemalang">KDL Pemalang</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Nama Daerah / Landmark</label>
          <input type="text" id="edit-nama" class="form-control" />
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Status Peta</label>
            <select id="edit-status" class="form-control">
              <option value="Tersedia">Kosong (Tersedia)</option>
              <option value="Dipinjam">Dipinjam</option>
            </select>
          </div>
          <div class="form-group">
            <label>Nama Pemegang</label>
            <input type="text" id="edit-pemegang" class="form-control" placeholder="Kosongkan jika tersedia" />
          </div>
        </div>

        <div class="form-group">
          <label>Tanggal Mulai / Catatan</label>
          <input type="text" id="edit-catatan" class="form-control" placeholder="Contoh: Mulai 13 Nov 2026" />
        </div>

        <button id="btn-save-territory" class="btn btn-primary btn-block">Simpan Perubahan</button>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // =========================================================================
    // GANTI DENGAN KONFIGURASI FIREBASE PROJECT KAMU
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCzX0UOkVwvRkUuGBWVcec92AWj2tjQeoE",
      authDomain: "territory-assistant-40a9b.firebaseapp.com",
      databaseURL: "https://territory-assistant-40a9b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "territory-assistant-40a9b",
      storageBucket: "territory-assistant-40a9b.firebasestorage.app",
      messagingSenderId: "729411479743",
      appId: "1:729411479743:web:bc19a775993ff6bf897e0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allTerritories = {};
    let activeKdl = "ALL";
    let searchQuery = "";
    let selectedId = null;

    // Inisialisasi Peta Leaflet
    const map = L.map("map").setView([-6.868, 109.136], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    const polygonLayerGroup = L.layerGroup().addTo(map);

    // Listen Data Territories dari Firebase
    onValue(ref(db, "territories"), (snapshot) => {
      allTerritories = snapshot.val() || {};
      renderTerritories();
    });

    // Render & Pengurutan Numerik Asli (1, 2, 3, ..., 10, ..., 100)
    function renderTerritories() {
      const listEl = document.getElementById("territory-list");
      const q = searchQuery.toLowerCase();

      const filtered = Object.entries(allTerritories)
        .map(([key, val]) => ({ ...val, _key: key }))
        .filter((t) => {
          if (activeKdl !== "ALL" && t.kdl !== activeKdl) return false;
          if (!q) return true;
          const judulLengkap = `daerah ${t.nomor} - ${t.nama}`.toLowerCase();
          const pemegang = (t.pemegang || "").toLowerCase();
          return judulLengkap.includes(q) || pemegang.includes(q) || String(t.nomor) === q;
        })
        .sort((a, b) => (parseInt(a.nomor, 10) || 0) - (parseInt(b.nomor, 10) || 0));

      const tersediaCount = filtered.filter((t) => t.status !== "Dipinjam").length;
      document.getElementById("count-shown").textContent = `Menampilkan ${filtered.length} peta`;
      document.getElementById("count-available").textContent = `Kosong: ${tersediaCount}`;

      listEl.innerHTML = "";
      polygonLayerGroup.clearLayers();

      filtered.forEach((t) => {
        const isDipinjam = t.status === "Dipinjam";
        const judulFormat = `Daerah ${t.nomor} - ${t.nama}`;

        const itemDiv = document.createElement("div");
        itemDiv.className = `territory-item ${t._key === selectedId ? "selected" : ""}`;
        itemDiv.innerHTML = `
          <div class="item-info">
            <div class="item-title" title="${judulFormat}">${judulFormat}</div>
            <div class="item-sub">${t.kdl || "Tanpa KDL"} • ${isDipinjam && t.pemegang ? `Pemegang: ${t.pemegang}` : (t.kategori || "Umum")}</div>
          </div>
          <span class="status-pill ${isDipinjam ? "status-dipinjam" : "status-kosong"}">
            ${isDipinjam ? "Dipinjam" : "Kosong"}
          </span>
        `;
        itemDiv.addEventListener("click", () => selectTerritory(t._key));
        listEl.appendChild(itemDiv);

        if (Array.isArray(t.koordinat) && t.koordinat.length > 0) {
          const isSelected = t._key === selectedId;
          const poly = L.polygon(t.koordinat, {
            color: isSelected ? "#2563eb" : (isDipinjam ? "#d97706" : "#16a34a"),
            weight: isSelected ? 3 : 1.5,
            fillOpacity: isSelected ? 0.35 : 0.15
          }).addTo(polygonLayerGroup);

          poly.bindTooltip(judulFormat, { sticky: true });
          poly.on("click", () => selectTerritory(t._key));
        }
      });
    }

    // Pilih Peta & Buka Panel Detail
    function selectTerritory(key) {
      selectedId = key;
      const t = allTerritories[key];
      if (!t) return;

      renderTerritories();

      const judulFormat = `Daerah ${t.nomor} - ${t.nama}`;
      document.getElementById("drawer-title").textContent = judulFormat;
      document.getElementById("drawer-meta").textContent = `${t.kdl || "-"} • Status: ${t.status || "Tersedia"}`;

      document.getElementById("edit-nomor").value = t.nomor || "";
      document.getElementById("edit-nama").value = t.nama || "";
      document.getElementById("edit-kdl").value = t.kdl || "KDL Tegal Timur";
      document.getElementById("edit-status").value = t.status === "Dipinjam" ? "Dipinjam" : "Tersedia";
      document.getElementById("edit-pemegang").value = t.pemegang || "";
      document.getElementById("edit-catatan").value = t.catatan || "";

      document.getElementById("detail-drawer").classList.add("open");

      if (Array.isArray(t.koordinat) && t.koordinat.length > 0) {
        const bounds = L.latLngBounds(t.koordinat);
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 17 });
      }
    }

    // Simpan Perubahan ke Firebase
    document.getElementById("btn-save-territory").addEventListener("click", async () => {
      if (!selectedId) return;
      const nomorInput = document.getElementById("edit-nomor").value.trim();
      const nomorBaru = nomorInput.isdigit ? String(parseInt(nomorInput, 10)) : (String(parseInt(nomorInput, 10) || nomorInput));
      const namaBaru = document.getElementById("edit-nama").value.trim();
      const kdlBaru = document.getElementById("edit-kdl").value;
      const statusBaru = document.getElementById("edit-status").value;
      const pemegangBaru = statusBaru === "Tersedia" ? "" : document.getElementById("edit-pemegang").value.trim();
      const catatanBaru = document.getElementById("edit-catatan").value.trim();

      await update(ref(db, `territories/${selectedId}`), {
        nomor: nomorBaru,
        nama: namaBaru,
        kdl: kdlBaru,
        status: statusBaru,
        pemegang: pemegangBaru,
        catatan: catatanBaru
      });

      document.getElementById("drawer-title").textContent = `Daerah ${nomorBaru} - ${namaBaru}`;
      document.getElementById("drawer-meta").textContent = `${kdlBaru} • Status: ${statusBaru}`;
      alert("Perubahan peta berhasil disimpan!");
    });

    // Event Filter Tab & Pencarian
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeKdl = btn.dataset.kdl;
        renderTerritories();
      });
    });

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderTerritories();
    });

    document.getElementById("btn-close-drawer").addEventListener("click", () => {
      document.getElementById("detail-drawer").classList.remove("open");
      selectedId = null;
      renderTerritories();
    });
  </script>
</body>
</html>
