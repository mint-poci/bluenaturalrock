<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal Peta Daerah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b;
      --border: #e2e8f0; --primary: #2563eb; --success: #10b981;
      --warning: #f59e0b; --danger: #ef4444; --hover: #f1f5f9;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;
      --border: #334155; --primary: #3b82f6; --hover: #263349;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    /* Kunci halaman agar tidak pernah geser kanan-kiri di HP */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: none; flex-direction: column; padding-bottom: 4rem;
    }

    /* Header Mobile-Friendly */
    nav {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem; display: flex; justify-content: space-between;
      align-items: center; position: sticky; top: 0; z-index: 100;
    }
    .brand { font-weight: 700; font-size: 0.98rem; display: flex; align-items: center; gap: 0.4rem; }
    .role-tag {
      font-size: 0.68rem; padding: 0.15rem 0.45rem; border-radius: 6px;
      background: rgba(37, 99, 235, 0.12); color: var(--primary); font-weight: 700;
    }
    .nav-actions { display: flex; gap: 0.45rem; align-items: center; }
    .btn-sm {
      border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.78rem;
      padding: 0.4rem 0.65rem; border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    .btn-logout { background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: transparent; }

    main { max-width: 760px; width: 100%; margin: 0.75rem auto; padding: 0 0.85rem; }

    /* Bar Navigasi Tab Scrollable di HP */
    .tab-strip {
      display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.4rem;
      margin-bottom: 0.75rem; scrollbar-width: none;
    }
    .tab-strip::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 0.45rem 0.8rem; border-radius: 99px; border: 1px solid var(--border);
      background: var(--card); color: var(--muted); font-size: 0.8rem; font-weight: 600;
      white-space: nowrap; cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Search & Quick Filter */
    .search-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .search-row input, .search-row select {
      padding: 0.55rem 0.75rem; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 0.85rem; min-width: 0;
    }
    .search-row input { flex: 1; }

    /* Compact List View (Mirip List HP) */
    .list-container {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden;
    }
    .list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 0.9rem; border-bottom: 1px solid var(--border);
      cursor: pointer; gap: 0.75rem; transition: background 0.12s;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:active, .list-item:hover { background: var(--hover); }
    .list-item.is-due { border-left: 3.5px solid var(--danger); }
    .item-left { display: flex; align-items: center; gap: 0.65rem; min-width: 0; flex: 1; }
    .item-num {
      font-size: 0.75rem; font-weight: 700; color: var(--primary);
      background: rgba(37, 99, 235, 0.1); padding: 0.25rem 0.45rem;
      border-radius: 6px; flex-shrink: 0;
    }
    .item-info { min-width: 0; flex: 1; }
    .item-title {
      font-size: 0.9rem; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .item-sub {
      font-size: 0.76rem; color: var(--muted); margin-top: 0.12rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .badge {
      font-size: 0.7rem; font-weight: 700; padding: 0.22rem 0.5rem;
      border-radius: 6px; flex-shrink: 0;
    }
    .b-avail { background: rgba(16, 185, 129, 0.12); color: var(--success); }
    .b-work { background: rgba(37, 99, 235, 0.12); color: var(--primary); }
    .b-due { background: rgba(239, 68, 68, 0.14); color: var(--danger); }

    /* Bottom Sheet / Modal Detail Peta Terkunci Anti-Geser */
    .modal-backdrop {
      position: fixed; inset: 0; width: 100vw; max-width: 100%; overflow-x: hidden;
      background: rgba(15, 23, 42, 0.65);
      display: none; align-items: flex-end; justify-content: center; z-index: 200;
    }
    .modal {
      background: var(--card); width: 100%; max-width: 100%; max-height: 92vh;
      overflow-y: auto; overflow-x: hidden; border-radius: 20px 20px 0 0; padding: 1.25rem;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 1rem; }
      .modal { border-radius: 16px; max-width: 620px; max-height: 88vh; }
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 0.85rem; gap: 0.5rem;
    }
    .modal-header > div { min-width: 0; flex: 1; }
    .close-btn {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: 700; flex-shrink: 0;
    }
    #mapContainer {
      height: 210px; width: 100%; max-width: 100%; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 1rem; z-index: 1;
    }

    /* Form Detail Sederhana */
    .field { margin-bottom: 0.85rem; max-width: 100%; }
    .field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 0.3rem; }
    .field input, .field select {
      width: 100%; max-width: 100%; min-width: 0; padding: 0.65rem 0.8rem; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem;
    }
    .admin-box {
      background: rgba(37, 99, 235, 0.05); border: 1px dashed var(--primary);
      border-radius: 12px; padding: 0.85rem; margin-bottom: 0.9rem; max-width: 100%;
    }
    .admin-box-title { font-size: 0.72rem; font-weight: 700; color: var(--primary); margin-bottom: 0.6rem; text-transform: uppercase; }
    .auto-info {
      font-size: 0.78rem; color: var(--muted); background: var(--bg);
      padding: 0.55rem 0.75rem; border-radius: 8px; margin-bottom: 0.9rem;
    }

    .btn-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
    .btn {
      width: 100%; padding: 0.7rem; border-radius: 10px; border: none;
      font-weight: 600; font-size: 0.88rem; cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-warning { background: rgba(245, 158, 11, 0.15); color: #d97706; }
    .btn-success { background: rgba(16, 185, 129, 0.15); color: var(--success); }

    /* Riwayat Ringkas */
    .history-box h4 { font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--muted); }
    .hist-item {
      font-size: 0.8rem; padding: 0.55rem 0; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; gap: 0.5rem;
    }
    .hist-item:last-child { border-bottom: none; }

    /* Panel Admin Kelola Anggota */
    .admin-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 1rem; display: none;
    }
    .member-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; gap: 0.5rem;
    }
  </style>
</head>
<body>

  <nav>
    <div class="brand">🗺️ Peta Daerah <span class="role-tag" id="roleBadge">Koordinator</span></div>
    <div class="nav-actions">
      <button class="btn-sm" id="themeToggle">🌙</button>
      <button class="btn-sm btn-logout" id="logoutBtn">Keluar</button>
    </div>
  </nav>

  <main>
    <!-- Strip Tab -->
    <div class="tab-strip">
      <button class="tab-btn active" data-tab="mine">Peta Saya (<span id="cMine">0</span>)</button>
      <button class="tab-btn" data-tab="all">Semua Peta (<span id="cAll">0</span>)</button>
      <button class="tab-btn" data-tab="due">⚠️ Perlu Audit (<span id="cDue">0</span>)</button>
      <button class="tab-btn" data-tab="members" id="adminTabBtn" style="display:none;">👥 Kelola Anggota</button>
    </div>

    <!-- Bagian Daftar Peta -->
    <div id="territoriesView">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Cari nomor, daerah, atau nama pemegang...">
        <select id="statusFilter">
          <option value="">Semua</option>
          <option value="avail">Kosong</option>
          <option value="work">Dikerjakan</option>
        </select>
      </div>
      <div class="list-container" id="territoryList">
        <div style="padding: 1.5rem; text-align: center; color: var(--muted); font-size: 0.85rem;">Memuat daftar peta...</div>
      </div>
    </div>

    <!-- Bagian Khusus Admin: Kelola Anggota -->
    <div class="admin-panel" id="membersView">
      <h3 style="font-size: 1rem; margin-bottom: 0.25rem;">Daftar Anggota Terdaftar</h3>
      <p style="font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem;">Hanya email di bawah ini yang bisa masuk dan mengakses data peta.</p>

      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;">
        <input type="email" id="newMemberEmail" placeholder="email.koordinator@gmail.com" style="flex:1; min-width: 180px; padding: 0.55rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
        <input type="text" id="newMemberName" placeholder="Nama Panggilan" style="width: 130px; padding: 0.55rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
        <select id="newMemberRole" style="padding: 0.55rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text);">
          <option value="koordinator">Koordinator</option>
          <option value="admin">Admin</option>
        </select>
        <button class="btn btn-primary" id="addMemberBtn" style="width: auto; padding: 0.55rem 1rem;">+ Tambah</button>
      </div>

      <div id="memberList"></div>
    </div>
  </main>

  <!-- Modal Detail Peta -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div style="font-size: 0.75rem; font-weight: 700; color: var(--primary);" id="mSubHeader">#001 • Umum</div>
          <h2 style="font-size: 1.15rem; margin-top: 0.1rem; word-wrap: break-word;" id="mNama">Nama Daerah</h2>
        </div>
        <button class="close-btn" id="closeModalBtn">✕</button>
      </div>

      <div id="mapContainer"></div>

      <!-- Kotak Khusus Admin (Hanya muncul untuk Admin) -->
      <div class="admin-box" id="adminOnlyFields" style="display: none;">
        <div class="admin-box-title">⚙️ Pengaturan Admin</div>
        <div class="field">
          <label>Koordinator Penanggung Jawab</label>
          <select id="fKoordinator">
            <option value="">-- Belum Di-assign --</option>
          </select>
        </div>
        <div class="field" style="margin-bottom: 0;">
          <label>Atribut / Kategori Peta</label>
          <select id="fKategori">
            <option value="Umum">Umum</option>
            <option value="Perkotaan">Perkotaan</option>
            <option value="Daerah Kelompok">Daerah Kelompok</option>
            <option value="Bisnis">Bisnis</option>
          </select>
        </div>
      </div>

      <!-- Form Simpel untuk Koordinator (Cuma 3 Field!) -->
      <div class="field">
        <label>Siapa yang mengerjakan</label>
        <input type="text" id="fPemegang" placeholder="Kosongkan jika belum ada">
      </div>
      <div class="field">
        <label>Tanggal mulai dikerjakan</label>
        <input type="date" id="fTglMulai">
      </div>
      <div class="field">
        <label>Catatan</label>
        <input type="text" id="fCatatan" placeholder="Catatan singkat (opsional)">
      </div>

      <div class="auto-info" id="autoAuditInfo">
        📅 Jadwal cek 4 bulan akan dihitung otomatis saat tanggal mulai diisi.
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="saveBtn">💾 Simpan</button>
        <button class="btn btn-warning" id="auditContinueBtn" style="display:none;">🔄 Audit 4 Bulan: Lanjut (+4 Bln)</button>
        <button class="btn btn-success" id="finishBtn" style="display:none;">✅ Selesai & Dikembalikan</button>
      </div>

      <div class="history-box">
        <h4>Riwayat Pengerjaan Sebelumnya</h4>
        <div id="historyList"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getDatabase, ref, onValue, update, push, set, remove, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCzX0UOkVwvRkUuGBWVcec92AWj2tjQeoE",
        authDomain: "territory-assistant-40a9b.firebaseapp.com",
        projectId: "territory-assistant-40a9b",
        storageBucket: "territory-assistant-40a9b.firebasestorage.app",
        messagingSenderId: "729411479743",
        appId: "1:729411479743:web:bc19a775993ff6bf897e0a"
    };

    const SUPER_ADMIN = "edenpemalang@gmail.com";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app, "https://territory-assistant-40a9b-default-rtdb.asia-southeast1.firebasedatabase.app");

    let currentUser = null;
    let isAdmin = false;
    let allTerritories = {};
    let allMembers = {};
    let activeTab = "mine";
    let selectedId = null;
    let map = null;
    let currentPolygon = null;

    function emailToKey(email) {
      return email.toLowerCase().trim().replace(/\./g, ",");
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      currentUser = user;
      const userEmail = user.email.toLowerCase();
      const userKey = emailToKey(userEmail);

      if (userEmail === SUPER_ADMIN) {
        await set(ref(db, `users/${userKey}`), { email: userEmail, name: "Eden (Super Admin)", role: "admin" });
      }

      const snap = await get(ref(db, `users/${userKey}`));
      if (!snap.exists() && userEmail !== SUPER_ADMIN) {
        alert("Maaf, email Anda (" + user.email + ") belum terdaftar sebagai koordinator. Hubungi Admin.");
        await signOut(auth);
        window.location.href = "index.html";
        return;
      }

      const userData = snap.val() || { role: "admin" };
      isAdmin = (userEmail === SUPER_ADMIN || userData.role === "admin");

      document.body.style.display = "flex";
      document.getElementById("roleBadge").textContent = isAdmin ? "Admin" : "Koordinator";
      if (isAdmin) {
        document.getElementById("adminTabBtn").style.display = "inline-block";
        document.getElementById("adminOnlyFields").style.display = "block";
        activeTab = "all";
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === "all"));
      }

      listenMembers();
      listenTerritories();
    });

    function addFourMonths(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      d.setMonth(d.getMonth() + 4);
      return d.toISOString().split("T")[0];
    }

    function isAuditDue(t) {
      if (!t.pemegang || !t.jatuh_tempo_audit) return false;
      const today = new Date().toISOString().split("T")[0];
      return t.jatuh_tempo_audit <= today;
    }

    function listenMembers() {
      onValue(ref(db, "users"), (snap) => {
        allMembers = snap.val() || {};
        renderMembers();
      });
    }

    function renderMembers() {
      const listEl = document.getElementById("memberList");
      const selectEl = document.getElementById("fKoordinator");
      const membersArr = Object.values(allMembers);

      listEl.innerHTML = membersArr.map(m => `
        <div class="member-row">
          <div style="min-width:0; flex:1;">
            <strong>${m.name || m.email}</strong> <span class="role-tag">${m.role}</span>
            <div style="font-size:0.75rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis;">${m.email}</div>
          </div>
          ${m.email !== SUPER_ADMIN ? `<button class="btn-sm btn-logout" onclick="removeMember('${m.email}')">Hapus</button>` : '<span style="font-size:0.72rem; color:var(--muted);">Utama</span>'}
        </div>
      `).join("");

      selectEl.innerHTML = `<option value="">-- Belum Di-assign --</option>` + membersArr.map(m =>
        `<option value="${m.email}">${m.name || m.email} (${m.email})</option>`
      ).join("");
    }

    document.getElementById("addMemberBtn").addEventListener("click", async () => {
      const email = document.getElementById("newMemberEmail").value.trim().toLowerCase();
      const name = document.getElementById("newMemberName").value.trim();
      const role = document.getElementById("newMemberRole").value;
      if (!email) return alert("Masukkan alamat email anggota.");

      await set(ref(db, `users/${emailToKey(email)}`), { email, name: name || email.split("@")[0], role });
      document.getElementById("newMemberEmail").value = "";
      document.getElementById("newMemberName").value = "";
    });

    window.removeMember = async function(email) {
      if (!confirm(`Hapus akses untuk ${email}?`)) return;
      await remove(ref(db, `users/${emailToKey(email)}`));
    };

    function listenTerritories() {
      onValue(ref(db, "territories"), (snap) => {
        allTerritories = snap.val() || {};
        renderList();
      });
    }

    function renderList() {
      const list = Object.values(allTerritories);
      const myEmail = currentUser.email.toLowerCase();
      const search = document.getElementById("searchInput").value.toLowerCase();
      const statFilter = document.getElementById("statusFilter").value;

      const mineList = list.filter(t => (t.koordinator || "").toLowerCase() === myEmail);
      const dueList = list.filter(t => isAuditDue(t) && (isAdmin || (t.koordinator || "").toLowerCase() === myEmail));

      document.getElementById("cMine").textContent = mineList.length;
      document.getElementById("cAll").textContent = list.length;
      document.getElementById("cDue").textContent = dueList.length;

      let sourceList = list;
      if (activeTab === "mine") sourceList = mineList;
      if (activeTab === "due") sourceList = dueList;

      const filtered = sourceList.filter(t => {
        const isWorking = t.pemegang && t.pemegang.trim() !== "";
        if (statFilter === "avail" && isWorking) return false;
        if (statFilter === "work" && !isWorking) return false;
        if (search) {
          const hay = `${t.nomor} ${t.nama} ${t.pemegang}`.toLowerCase();
          if (!hay.includes(search)) return false;
        }
        return true;
      });

      const container = document.getElementById("territoryList");
      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding: 1.5rem; text-align: center; color: var(--muted); font-size: 0.85rem;">Tidak ada peta di daftar ini.</div>`;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const due = isAuditDue(t);
        const isWorking = t.pemegang && t.pemegang.trim() !== "";
        let badge = `<span class="badge b-avail">Kosong</span>`;
        if (due) badge = `<span class="badge b-due">Audit!</span>`;
        else if (isWorking) badge = `<span class="badge b-work">Aktif</span>`;

        const subText = isWorking
          ? `👤 ${t.pemegang} • Mulai ${t.tanggal_mulai || '-'}`
          : `${t.kategori || 'Umum'}${isAdmin && t.koordinator ? ' • Koord: ' + t.koordinator.split('@')[0] : ''}`;

        return `
          <div class="list-item ${due ? 'is-due' : ''}" onclick="openDetail('${t.id}')">
            <div class="item-left">
              <span class="item-num">#${t.nomor}</span>
              <div class="item-info">
                <div class="item-title">${t.nama}</div>
                <div class="item-sub">${subText}</div>
              </div>
            </div>
            ${badge}
          </div>
        `;
      }).join("");
    }

    function closeModal() {
      document.getElementById("detailModal").style.display = "none";
      document.body.style.overflow = "";
    }

    window.openDetail = function(id) {
      selectedId = id;
      const t = allTerritories[id];
      if (!t) return;

      document.getElementById("mSubHeader").textContent = `PETA #${t.nomor} • ${t.kategori || 'Umum'}`;
      document.getElementById("mNama").textContent = t.nama;
      if (isAdmin) {
        document.getElementById("fKoordinator").value = t.koordinator || "";
        document.getElementById("fKategori").value = t.kategori || "Umum";
      }

      document.getElementById("fPemegang").value = t.pemegang || "";
      document.getElementById("fTglMulai").value = t.tanggal_mulai || "";
      document.getElementById("fCatatan").value = t.catatan || "";

      const hasHolder = t.pemegang && t.pemegang.trim() !== "";
      document.getElementById("auditContinueBtn").style.display = hasHolder ? "block" : "none";
      document.getElementById("finishBtn").style.display = hasHolder ? "block" : "none";

      updateAutoAuditText(t.tanggal_mulai, t.jatuh_tempo_audit);

      const histEl = document.getElementById("historyList");
      const riwayatArr = t.riwayat ? Object.values(t.riwayat).reverse() : [];
      histEl.innerHTML = riwayatArr.length === 0
        ? `<div style="font-size:0.8rem; color:var(--muted);">Belum ada riwayat sebelumnya.</div>`
        : riwayatArr.map(r => `
            <div class="hist-item">
              <div><strong>${r.pemegang}</strong><div style="color:var(--muted); font-size:0.74rem;">${r.keterangan || ''}</div></div>
              <div style="text-align:right; font-size:0.74rem; color:var(--muted);">${r.tanggal_mulai || '-'}<br>s/d ${r.tanggal_kembali || '-'}</div>
            </div>
          `).join("");

      document.getElementById("detailModal").style.display = "flex";
      document.body.style.overflow = "hidden";

      setTimeout(() => {
        if (!map) {
          map = L.map("mapContainer").setView([-6.89, 109.38], 13);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OSM" }).addTo(map);
        }
        map.invalidateSize();
        if (currentPolygon) map.removeLayer(currentPolygon);
        if (t.koordinat && t.koordinat.length > 0) {
          currentPolygon = L.polygon(t.koordinat, { color: "#2563eb", fillOpacity: 0.25 }).addTo(map);
          map.fitBounds(currentPolygon.getBounds());
        }
      }, 150);
    };

    function updateAutoAuditText(tglMulai, existingDue) {
      const infoEl = document.getElementById("autoAuditInfo");
      if (!tglMulai) {
        infoEl.textContent = "📅 Jadwal cek 4 bulan akan otomatis dihitung setelah tanggal mulai diisi.";
        return;
      }
      const target = existingDue || addFourMonths(tglMulai);
      infoEl.innerHTML = `📅 Jadwal audit 4 bulan otomatis: <strong>${target}</strong>`;
    }

    document.getElementById("fTglMulai").addEventListener("change", (e) => {
      updateAutoAuditText(e.target.value, "");
    });

    // Simpan Perubahan
    document.getElementById("saveBtn").addEventListener("click", async () => {
      if (!selectedId) return;
      const t = allTerritories[selectedId];
      const pemegang = document.getElementById("fPemegang").value.trim();
      const tglMulai = document.getElementById("fTglMulai").value;
      let jatuhTempo = "";
      if (pemegang && tglMulai) {
        jatuhTempo = (tglMulai === t.tanggal_mulai && t.jatuh_tempo_audit) ? t.jatuh_tempo_audit : addFourMonths(tglMulai);
      }

      const payload = {
        pemegang,
        status: pemegang ? "Sedang Dikerjakan" : "Tersedia",
        tanggal_mulai: tglMulai,
        jatuh_tempo_audit: jatuhTempo,
        catatan: document.getElementById("fCatatan").value.trim()
      };

      if (isAdmin) {
        payload.koordinator = document.getElementById("fKoordinator").value;
        payload.kategori = document.getElementById("fKategori").value;
      }

      await update(ref(db, `territories/${selectedId}`), payload);
      closeModal();
    });

    // Audit 4 Bulan: Lanjut
    document.getElementById("auditContinueBtn").addEventListener("click", async () => {
      if (!selectedId) return;
      const pemegang = document.getElementById("fPemegang").value.trim();
      if (!pemegang) return;
      const today = new Date().toISOString().split("T")[0];
      const nextDue = addFourMonths(today);

      await push(ref(db, `territories/${selectedId}/riwayat`), {
        pemegang,
        tanggal_mulai: document.getElementById("fTglMulai").value || today,
        keterangan: `Audit 4 Bln (${today}): Lanjut`,
        tanggal_kembali: "Masih berjalan"
      });
      await update(ref(db, `territories/${selectedId}`), { jatuh_tempo_audit: nextDue });
      openDetail(selectedId);
    });

    // Selesai & Dikembalikan
    document.getElementById("finishBtn").addEventListener("click", async () => {
      if (!selectedId) return;
      const pemegang = document.getElementById("fPemegang").value.trim();
      if (!pemegang) return;
      const today = new Date().toISOString().split("T")[0];

      await push(ref(db, `territories/${selectedId}/riwayat`), {
        pemegang,
        tanggal_mulai: document.getElementById("fTglMulai").value || today,
        keterangan: "Selesai & Dikembalikan",
        tanggal_kembali: today
      });
      await update(ref(db, `territories/${selectedId}`), {
        pemegang: "", status: "Tersedia", tanggal_mulai: "", jatuh_tempo_audit: "", catatan: ""
      });
      openDetail(selectedId);
    });

    // Tab Navigation
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeTab = btn.dataset.tab;
        const isMembers = activeTab === "members";
        document.getElementById("territoriesView").style.display = isMembers ? "none" : "block";
        document.getElementById("membersView").style.display = isMembers ? "block" : "none";
        if (!isMembers) renderList();
      });
    });

    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("searchInput").addEventListener("input", renderList);
    document.getElementById("statusFilter").addEventListener("change", renderList);
    document.getElementById("logoutBtn").addEventListener("click", async () => { await signOut(auth); window.location.href = "index.html"; });

    const themeToggle = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);
    themeToggle.textContent = savedTheme === "dark" ? "☀️" : "🌙";
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      themeToggle.textContent = next === "dark" ? "☀️" : "🌙";
    });
  </script>
</body>
</html>
